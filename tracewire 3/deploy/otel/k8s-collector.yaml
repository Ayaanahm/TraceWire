apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector, namespace: observability }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols: { http: { endpoint: 0.0.0.0:4318 } }
    processors:
      batch: {}
      memory_limiter: { check_interval: 1s, limit_mib: 200 }
    exporters:
      otlp/jaeger: { endpoint: "jaeger.observability:4317", tls: { insecure: true } }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/jaeger] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{ containerPort: 4318 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: cfg, mountPath: /etc/otel }]
      volumes: [{ name: cfg, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: observability }
spec:
  selector: { app: otel-collector }
  ports: [{ name: otlp-http, port: 4318 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.63.0
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports: [{ containerPort: 4317 }, { containerPort: 16686 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: observability }
spec:
  selector: { app: jaeger }
  ports: [{ name: otlp-grpc, port: 4317 }, { name: ui, port: 16686 }]
