apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: { app.kubernetes.io/name: orders, app.kubernetes.io/part-of: tracewire }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: orders }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orders, app.kubernetes.io/part-of: tracewire }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: tracewire-orders
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - { name: ADDR, value: ":8081" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4318" }
            - { name: TRACE_SAMPLE_RATIO, value: "0.1" }
            # Keep serving for this long after SIGTERM while readiness reports 503,
            # so kube-proxy removes the pod from Service endpoints before the
            # listener closes. See docs/technical-decisions.md.
            - { name: SHUTDOWN_DRAIN_DELAY, value: "5s" }
            - { name: INVENTORY_URL, value: "http://inventory:8082" }
            - { name: FAULT_BASE_LATENCY_MS, value: "8" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels: { app.kubernetes.io/name: orders, app.kubernetes.io/part-of: tracewire }
spec:
  selector: { app.kubernetes.io/name: orders }
  ports: [{ name: http, port: 8081, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: orders }
