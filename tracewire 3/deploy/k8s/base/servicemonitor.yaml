# Scraped by kube-prometheus-stack (installed by terraform/).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tracewire
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app.kubernetes.io/part-of: tracewire }
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      enableHttp2: false
